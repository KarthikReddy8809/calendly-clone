# Local development database. Matches the DATABASE_URL in
# apps/server/.env.example: mysql://root:password@localhost:3306/calendly
#
#   pnpm db:up      start MySQL in the background and wait until it is healthy
#   pnpm db:down    stop it (data is kept in the calendly-mysql-data volume)
#
# If another MySQL already listens on 3306, pick another host port:
#   MYSQL_PORT=3307 pnpm db:up
# and use port 3307 in DATABASE_URL.
#
# Development only: the root password is a known default, and the port is
# bound to 127.0.0.1 so the database is not reachable from the network.

name: calendly

services:
  calendly-mysql:
    image: mysql:8.0
    container_name: calendly-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
      MYSQL_DATABASE: calendly
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    ports:
      - '127.0.0.1:${MYSQL_PORT:-3306}:3306'
    volumes:
      - calendly-mysql-data:/var/lib/mysql
    healthcheck:
      # Ping over TCP so the check only passes once the server accepts
      # connections, not during the init phase's temporary socket-only server.
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  calendly-mysql-data:
    name: calendly-mysql-data
